name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的标签（如 v1.0.0）'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: 编译
        shell: cmd
        run: |
          set CSC=%SystemRoot%\Microsoft.NET\Framework64\v4.0.30319\csc.exe
          if not exist dist mkdir dist
          "%CSC%" /nologo /target:winexe /optimize+ /win32manifest:src\app.manifest /win32icon:src\app.ico /out:dist\WaterCoolSim.exe /r:System.Windows.Forms.dll /r:System.Drawing.dll /r:System.Management.dll src\WaterCoolSim.cs src\MonetM3.cs
      - name: 界面自检
        shell: cmd
        run: dist\WaterCoolSim.exe --guitest || exit /b 1
      - name: 打包
        shell: pwsh
        run: Copy-Item dist/WaterCoolSim.exe dist/WaterCoolSim.exe.bak; Compress-Archive -Path dist/WaterCoolSim.exe -DestinationPath dist/WaterCoolSim.zip
      - name: 发布 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create $env:TAG dist/WaterCoolSim.exe dist/WaterCoolSim.zip --title "虚拟水冷坞 $env:TAG" --generate-notes --latest
